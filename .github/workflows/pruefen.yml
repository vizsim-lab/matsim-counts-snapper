# Bei jedem Push und Pull Request: die Tests der Bausteine (node --test) und die Browser-Tests
# (Playwright, gegen die Testdaten in tests/web/fixtures, ohne Netz nach draußen). Auf main
# veröffentlicht danach dieser Workflow die Seite – aber nur, wenn GitHub Pages auf „GitHub
# Actions“ steht (Einstellungen > Pages > Quelle). Solange Pages noch direkt aus dem Branch
# veröffentlicht, geht die Seite ohne Tests online; der Workflow sagt das als Hinweis.
#
# Runner auf ubuntu-24.04 gepinnt wie in der Zählkarte: `playwright install --with-deps` braucht
# eine Playwright-Version, die das Ubuntu des Runners kennt.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests (Bausteine und Browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests der Bausteine
        run: npm test
      - name: Chromium für die Browser-Tests
        run: npx playwright install --with-deps chromium
      - name: Browser-Tests
        run: npm run test:web
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Seite zusammenstellen (ohne Tests und Testdaten)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          mkdir _site
          cp -r index.html app.js worker.js lib vendor README.md THIRD_PARTY_LICENSES.md _site/
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        with:
          path: _site/

  pages:
    name: Quelle von GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: read
    outputs:
      quelle: ${{ steps.quelle.outputs.quelle }}
    steps:
      - id: quelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          quelle=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unbekannt)
          echo "quelle=$quelle" >> "$GITHUB_OUTPUT"
          if [ "$quelle" != "workflow" ]; then
            echo "::notice title=GitHub Pages::Die Seite kommt noch direkt aus dem Branch ($quelle) und geht ohne Tests online. Unter Einstellungen > Pages die Quelle auf „GitHub Actions“ stellen, dann veröffentlicht dieser Workflow erst nach grünen Tests."
          fi

  deploy:
    name: Veröffentlichen (GitHub Pages)
    needs: [tests, pages]
    if: ${{ needs.pages.outputs.quelle == 'workflow' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
